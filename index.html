<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Survivor | Goliat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="hud">
        <div class="stats">NIVEL: <span id="nivel">1</span> | BAJAS: <span id="bajas">0</span></div>
        <div class="barra-vida"><div id="vida-lleno"></div></div>
        <div style="color: #facc15; font-weight: bold; margin-top: 5px;">
            MONEDAS: <span id="contador-monedas">0</span>
        </div>
    </div>

    <div id="joystick-base">
        <div id="joystick-stick"></div>
    </div>

    <div id="pantalla-game-over" class="centrado-total" style="display: none; flex-direction: column;">
        <h1 id="titulo-muerte">SISTEMA COLAPSADO</h1>
        <div class="stats-finales">
            <p>NIVEL FINAL: <span id="final-nivel">0</span></p>
            <p>BAJAS TOTALES: <span id="final-bajas">0</span></p>
        </div>
        
        <div style="display: flex; gap: 15px; margin-top: 20px;">
            <button id="btn-final-reiniciar" onclick="location.reload()" style="cursor: pointer;">REINICIAR</button>
            <button id="btn-tienda" onclick="abrirTienda()" style="padding: 15px 25px; background: #facc15; color: #020617; border: none; font-weight: bold; cursor: pointer; border-radius: 5px;">TIENDA</button>
        </div>
    </div>

    <div id="tienda-ui" style="display:none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(15, 23, 42, 0.98); padding: 30px; border: 2px solid #facc15; color: white; text-align: center; border-radius: 15px; z-index: 200; min-width: 300px;">
        <h2 style="color: #facc15;">TIENDA NEÓN</h2>
        <p style="font-size: 1.2em;">Tus Monedas: <span id="tienda-monedas">0</span></p>
        
        <div style="display: flex; gap: 15px; justify-content: center; margin: 25px 0;">
            <div onclick="comprarSkin('#38bdf8', 0)" style="cursor:pointer;">
                <div style="background: #38bdf8; width: 45px; height: 45px; border-radius: 50%; margin: 0 auto; border: 2px solid white;"></div>
                <p style="font-size: 12px; margin-top: 5px;">Básica<br>Gratis</p>
            </div>
            <div onclick="comprarSkin('#facc15', 50)" style="cursor:pointer;">
                <div style="background: #facc15; width: 45px; height: 45px; border-radius: 50%; margin: 0 auto;"></div>
                <p style="font-size: 12px; margin-top: 5px;">Oro<br>50 💰</p>
            </div>
            <div onclick="comprarSkin('#a855f7', 100)" style="cursor:pointer;">
                <div style="background: #a855f7; width: 45px; height: 45px; border-radius: 50%; margin: 0 auto;"></div>
                <p style="font-size: 12px; margin-top: 5px;">Épica<br>100 💰</p>
            </div>
            <div onclick="comprarSkin('#4ade80', 200)" style="cursor:pointer;">
                <div style="background: #4ade80; width: 45px; height: 45px; border-radius: 50%; margin: 0 auto;"></div>
                <p style="font-size: 12px; margin-top: 5px;">Neo<br>200 💰</p>
            </div>
        </div>
        
        <button onclick="cerrarTienda()" style="background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold;">CERRAR</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script src="game.js"></script>
</body>
</html>
